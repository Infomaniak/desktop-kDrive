name: Build macOS Swift client
description: 'Build the redesigned macOS Swift client and server'

inputs:
  qt_account_email:
    description: 'Qt account email for unattended installation'
    required: true
  qt_account_password:
    description: 'Qt account password for unattended installation'
    required: true
  keychain_password:
    description: 'The password of the keychain'
    required: true
  release_build:
    description: 'If true, run the release build script'
    required: false
    default: 'false'
  release_build_altool_username:
    description: 'Username for altool upload'
    required: false
    default: ''
  release_build_notary_app_password:
    description: 'Password for notary app'
    required: false
    default: ''

runs:
    using: "composite"
    steps:
      - name: Prepare Python environment
        shell: bash
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          python -m pip install 'conan==2.25.2'

      - name: Clean-up XCode DerivedData
        run : rm -rf /Users/runner/Library/Developer/Xcode/DerivedData
        shell: bash

      - name: Grant empty trash script execute permission
        run : chmod +x ./infomaniak-build-tools/empty_drive_trash.sh
        shell: bash

      - name: Empty drive's trash
        run : ./infomaniak-build-tools/empty_drive_trash.sh
        shell: bash

      - name: Unlock keychain to use the certificate
        run : security unlock-keychain -p '${{ inputs.keychain_password }}' login.keychain
        shell: bash

      - name: Grant building script execute permission
        run : |
            if [ "${{ inputs.release_build }}" = "true" ]; then
                chmod +x ./infomaniak-build-tools/macos/build-release.sh
            else
                chmod +x ./infomaniak-build-tools/macos/build-ci.sh
            fi
        shell: bash

      - name: Build kDrive desktop
        id: build
        env:
          QT_ACCOUNT_EMAIL: ${{ inputs.qt_account_email }}
          QT_ACCOUNT_PASSWORD: ${{ inputs.qt_account_password }}
          NOTARY_APP_PASSWORD: ${{ inputs.release_build_notary_app_password }}
          ALTOOL_USERNAME: ${{ inputs.release_build_altool_username }}
        run : |
            if [ "${{ inputs.release_build }}" = "true" ]; then
                SKIP_SPARKLE=1 ./infomaniak-build-tools/macos/build-release.sh
            else
                ./infomaniak-build-tools/macos/build-ci.sh
            fi
        shell: bash

      - name: Fetch dependencies
        run: |
          mkdir dependencies
          cp -R ${{ github.workspace }}/build-macos/client/install/kDrive.app/Contents/Frameworks/QtWidgets.framework ./dependencies/
          cp -R ${{ github.workspace }}/build-macos/client/install/kDrive.app/Contents/Frameworks/QtGui.framework ./dependencies/
          cp -R ${{ github.workspace }}/build-macos/client/install/kDrive.app/Contents/Frameworks/QtNetwork.framework ./dependencies/
          cp -R ${{ github.workspace }}/build-macos/client/install/kDrive.app/Contents/Frameworks/QtSql.framework ./dependencies/
          cp -R ${{ github.workspace }}/build-macos/client/install/kDrive.app/Contents/Frameworks/QtCore.framework ./dependencies/
          cp -R ${{ github.workspace }}/build-macos/client/install/kDrive.app/Contents/Frameworks/QtSvg.framework ./dependencies/
          cp -R ${{ github.workspace }}/build-macos/client/install/kDrive.app/Contents/Frameworks/QtDBus.framework ./dependencies/
          cp -R ${{ github.workspace }}/build-macos/client/install/kDrive.app/Contents/Frameworks/Sparkle.framework ./dependencies/
          cp /usr/local/lib/libzip.5.dylib ./dependencies/
          cp /usr/local/lib/libzstd.1.dylib ./dependencies/
          cp /usr/local/lib/libcppunit-1.15.2.dylib ./dependencies/
          cp ${{ github.workspace }}/build-macos/client/bin/crashpad_handler ./dependencies/
          # kDrive_vfs_mac lib is not cached and therefore is uploaded as a separate artifact
          find "${{ github.workspace }}/build-macos/client/bin" -name "*.dylib" \
            -not -name "kDrive_vfs_mac.dylib" \
            -exec cp {} ./dependencies/ \;
        shell: bash
        if: ${{ steps.build.outcome == 'success' && inputs.release_build == 'false' }} # Only copy dependencies for debug builds, release builds will have them in the app bundle

      - name: Fetch Conan dependencies
        run: |
          echo "Sourcing conanrun.sh to get DYLD_LIBRARY_PATH & PATH..."
          source $(find "${{ github.workspace }}/build-macos" -name conanrun.sh | head -n 1)
          
          echo "\nSearching dylibs in DYLD_LIBRARY_PATH..."
          IFS=':' read -ra dirs <<< "$DYLD_LIBRARY_PATH"
          for dir in "${dirs[@]}"; do
            if [[ "$dir" == *".conan2/p"* ]]; then
              echo "Looking in $dir"
              # We skip the dSYM directories to avoid copying debug symbols and copy only the necessary libraries (Ex: '/Users/runner/.conan2/p/b/sentr<hash>/p/lib/libsentry.dylib.dSYM/Contents/Resources/DWARF/libsentry.dylib')
              find "$dir" \
                  -path '*/*.dSYM/*' -prune -o \
                  '(' -iname 'libxxhash.0.dylib' \
                   -o -iname 'liblog4cplus*.dylib' \
                   -o -iname 'libsentry.dylib' \
                   -o -iname 'libssl*.dylib' \
                   -o -iname 'libcrypto*.dylib' \
                   -o -iname 'libz.*.dylib' \
                   -o -iname 'libPocoNetSSL*.dylib' \
                   -o -iname 'libPocoUtil*.dylib' \
                   -o -iname 'libPocoJSON*.dylib' \
                   -o -iname 'libPocoXML*.dylib' \
                   -o -iname 'libPocoFoundation*.dylib' \
                   -o -iname 'libPocoNet*.dylib' \
                   -o -iname 'libPocoCrypto*.dylib' \
          ')' \
                -exec cp {} ./dependencies/ \; \
                -exec echo "Conan dependency found -> " {} \;
              if [[ "$dir" == *"/qt"* ]]; then
                find "$(dirname $dir)" \
                    '(' -iname 'libqoffscreen.dylib' ')' \
                    -exec mkdir -p ./dependencies/platforms \; \
                    -exec cp {} ./dependencies/platforms/ \; \
                    -exec echo "Conan Qt dependency found -> " {} \;
              fi
            fi
          done
          # Restore the original environment variables set before running conanrun.sh
              deactivate_script=$(find "${{ github.workspace }}/build-macos" -name deactivate_conanrun.sh | head -n 1)
              if [ -n "$deactivate_script" ]; then
                source "$deactivate_script"
              fi
        shell: bash
        if: ${{ steps.build.outcome == 'success' && inputs.release_build == 'false' }}

      - name: Fetch kDrive dependencies (lst and vfs lib)
        run: |
          mkdir uncached_dependencies
          if [ "${{ inputs.release_build }}" = "true" ]; then
                cp ${{ github.workspace }}/build-macos/client/install/kDrive.app/Contents/Resources/*.lst ./uncached_dependencies/
                cp ${{ github.workspace }}/build-macos/client/install/kDrive.app/Contents/Resources/sync-folder-rules.csv ./uncached_dependencies/
          else
                cp ${{ github.workspace }}/build-macos/client/bin/*.lst ./uncached_dependencies/
                cp ${{ github.workspace }}/build-macos/client/bin/sync-folder-rules.csv ./uncached_dependencies/
          fi

          cp ${{ github.workspace }}/build-macos/client/bin/kDrive_vfs_mac.dylib ./uncached_dependencies/
          
        shell: bash
        if: ${{ steps.build.outcome == 'success' }}

      - name: Download sentry-cli for macOS
        run: |
          curl --fail --location https://github.com/getsentry/sentry-cli/releases/download/2.46.0/sentry-cli-Darwin-universal -o "$RUNNER_TEMP/sentry-cli"
          chmod +x "$RUNNER_TEMP/sentry-cli"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
        shell: bash
        if: ${{ steps.build.outcome == 'success' && inputs.release_build == 'true' }}

      - name: Create Sentry server and Swift client artifacts
        run: |
          bash ./infomaniak-build-tools/macos/bundle-release-symbols.sh
        shell: bash
        if: ${{ steps.build.outcome == 'success' && inputs.release_build == 'true' }}

      - name: Get kDrive version
        id: get-version
        uses: ./.github/actions/get_version
        if: steps.build.outcome == 'success'

      - name: Generate Sparkle artifacts
        run: |
          bash ./infomaniak-build-tools/macos/generate-sparkle.sh
        shell: bash
        if: ${{ steps.build.outcome == 'success' && inputs.release_build == 'true' }}

      - name: Validate signed universal Swift release and required artifacts
        run: bash ./infomaniak-build-tools/macos/validate-release.sh
        shell: bash
        if: ${{ steps.build.outcome == 'success' && inputs.release_build == 'true' }}

      - name: Upload build common files
        uses: actions/upload-artifact@v7.0.1
        with:
          name: macos-build-common-files
          path: ./dependencies
          retention-days: 1
          compression-level: 0
        if: ${{ steps.build.outcome == 'success' && inputs.release_build == 'false' }}

      - name: Upload uncached build common files
        uses: actions/upload-artifact@v7.0.1
        with:
          name: macos-build-common-files-uncached
          path: ./uncached_dependencies
          retention-days: 1
        if: ${{ steps.build.outcome == 'success' }}

      - name: Upload build test common executable
        uses: actions/upload-artifact@v7.0.1
        with:
          name: macos-kDrive_test_common
          path: ${{ github.workspace }}/build-macos/client/bin/kDrive_test_common
          retention-days: 1
          compression-level: 0
        if: ${{ steps.build.outcome == 'success' && inputs.release_build == 'false' }}

      - name: Upload build test common server executable
        uses: actions/upload-artifact@v7.0.1
        with:
          name: macos-kDrive_test_common_server
          path: ${{ github.workspace }}/build-macos/client/bin/kDrive_test_common_server
          retention-days: 1
          compression-level: 0
        if: ${{ steps.build.outcome == 'success' && inputs.release_build == 'false' }}

      - name: Upload build test server executable
        uses: actions/upload-artifact@v7.0.1
        with:
          name: macos-kDrive_test_server
          path: ${{ github.workspace }}/build-macos/client/bin/kDrive_test_server
          retention-days: 1
          compression-level: 0
        if: ${{ steps.build.outcome == 'success' && inputs.release_build == 'false' }}

      - name: Upload build test syncengine executable
        uses: actions/upload-artifact@v7.0.1
        with:
          name: macos-kDrive_test_syncengine
          path: ${{ github.workspace }}/build-macos/client/bin/kDrive_test_syncengine
          retention-days: 1
          compression-level: 0
        if: ${{ steps.build.outcome == 'success' && inputs.release_build == 'false' }}

      - name: Upload build test parms executable
        uses: actions/upload-artifact@v7.0.1
        with:
          name: macos-kDrive_test_parms
          path: ${{ github.workspace }}/build-macos/client/bin/kDrive_test_parms
          retention-days: 1
          compression-level: 0
        if: ${{ steps.build.outcome == 'success' && inputs.release_build == 'false' }}

      - name: Upload sentry server artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: macos-release-artifacts-server-debug
          path: ${{ github.workspace }}/build-macos/sentry-server-artifacts
          if-no-files-found: error
          retention-days: 1
        if: ${{ steps.build.outcome == 'success' && inputs.release_build == 'true' }}

      - name: Upload sentry client artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: macos-release-artifacts-client-debug
          path: ${{ github.workspace }}/build-macos/sentry-client-artifacts
          if-no-files-found: error
          retention-days: 1
        if: ${{ steps.build.outcome == 'success' && inputs.release_build == 'true' }}

      - name: Display macOS package info in summary
        shell: bash
        if: ${{ steps.build.outcome == 'success' && inputs.release_build == 'true' }}
        run: |
          FILE="${{ github.workspace }}/build-macos/client/install/kDrive-${{ steps.get-version.outputs.kDrive_version_macos }}.pkg"

          HASH=$(shasum -a 256 "$FILE" | awk '{print $1}')

          echo "### 🔐 macOS redesigned Swift client pkg SHA256" >> "$GITHUB_STEP_SUMMARY"
          echo "$HASH" >> "$GITHUB_STEP_SUMMARY"

          # Create .sha256 file next to the pkg
          echo "$HASH  $(basename "$FILE")" > "${FILE}.sha256"

      - name: Upload kDrive Package
        uses: actions/upload-artifact@v7.0.1
        with:
          name: macos-release-artifacts-package
          path: |
            ${{ github.workspace }}/build-macos/client/install/kDrive-${{ steps.get-version.outputs.kDrive_version_macos }}.pkg
            ${{ github.workspace }}/build-macos/client/install/kDrive-${{ steps.get-version.outputs.kDrive_version_macos }}.pkg.sha256
          if-no-files-found: error
          retention-days: 1
        if: ${{ steps.build.outcome == 'success' && inputs.release_build == 'true' }}

      - name: Generate recovery updater SHA256
        shell: bash
        if: ${{ steps.build.outcome == 'success' && inputs.release_build == 'true' }}
        run: |
          FILE="${{ github.workspace }}/build-macos/client/install/kDriveRecoveryUpdater-${{ steps.get-version.outputs.kDrive_version_macos }}.zip"

          HASH=$(shasum -a 256 "$FILE" | awk '{print $1}')

          echo "### macOS Recovery Updater SHA256" >> "$GITHUB_STEP_SUMMARY"
          echo "$HASH" >> "$GITHUB_STEP_SUMMARY"

          echo "$HASH  $(basename "$FILE")" > "${FILE}.sha256"

      - name: Upload recovery updater
        uses: actions/upload-artifact@v7.0.1
        with:
          name: macos-release-artifacts-recovery-updater
          path: |
            ${{ github.workspace }}/build-macos/client/install/kDriveRecoveryUpdater-${{ steps.get-version.outputs.kDrive_version_macos }}.zip
            ${{ github.workspace }}/build-macos/client/install/kDriveRecoveryUpdater-${{ steps.get-version.outputs.kDrive_version_macos }}.zip.sha256
          if-no-files-found: error
          retention-days: 1
        if: ${{ steps.build.outcome == 'success' && inputs.release_build == 'true' }}

      - name: Upload Sparkle artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: macos-release-artifacts-sparkle
          path: |
            ${{ github.workspace }}/build-macos/client/install/sparkle/kDrive-${{ steps.get-version.outputs.kDrive_version_macos }}.zip
            ${{ github.workspace }}/build-macos/client/install/sparkle/update-macos-${{ steps.get-version.outputs.kDrive_version_macos }}.xml
          if-no-files-found: error
          retention-days: 1
        if: ${{ steps.build.outcome == 'success' && inputs.release_build == 'true' }}

      - name: Clean-up generated code
        run : rm -rf build-macos/
        shell: bash
