name: Set up macOS build
description: Report the selected Xcode and prepare the repository Python environment

runs:
  using: composite
  steps:
    - name: Report selected Xcode
      shell: bash
      run: |
        xcodebuild -version
        xcrun clang --version
        xcrun --sdk macosx --show-sdk-path

    - name: Prepare Python environment
      shell: bash
      run: |
        python3 -m venv .venv
        source .venv/bin/activate
        python -m pip install 'conan==2.25.2'
        conan --version
        # Export the checked-out recipe so persistent caches use the AGL fix.
        conan export infomaniak-build-tools/conan/recipes/qt/all --version=6.2.3
