name: PR Auto Labeler

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to assess for QA required labeling (manual runs)"
        required: false
        default: ""

permissions:
  contents: read
  pull-requests: write

jobs:
  path-labels:
    if: github.event_name == 'pull_request'
    runs-on: self-hosted
    steps:
      - name: Apply path-based labels
        uses: actions/labeler@v6.0.1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml

  quick-fix-label:
    if: github.event_name == 'pull_request'
    runs-on: self-hosted
    steps:
      - name: Check total changed lines and add quick fix label
        uses: actions/github-script@v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = context.payload.pull_request.number;

            // List files in PR
            const files = await github.paginate(
              github.rest.pulls.listFiles,
              {
                owner,
                repo,
                pull_number: prNumber,
                per_page: 100,
              }
            );

            // Sum additions + deletions
            const changed = files.reduce(
              (sum, f) => sum + (f.additions || 0) + (f.deletions || 0),
              0
            );

            core.info(`Total changed lines: ${changed}`);

            if (changed <= 20) {
              try {
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: prNumber,
                  labels: ["quick fix 🚀"],
                });
                core.info('Added "quick fix 🚀" label.');
              } catch (e) {
                core.warning(`Failed to add label: ${e.message}`);
              }
            } else {
              core.info("Change exceeds quick fix threshold; not labeling.");
            }

  qa-required-label:
    if: github.event_name == 'pull_request_review' || github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    steps:
      - name: Apply QA required label from Copilot review verdict
        uses: actions/github-script@v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            let prNumber;
            if (github.event_name === 'workflow_dispatch') {
              prNumber = parseInt(core.getInput('pr_number'), 10);
              if (!prNumber) {
                core.info('workflow_dispatch without pr_number input; nothing to do.');
                return;
              }
            } else {
              prNumber = context.payload.pull_request.number;
            }

            // The Copilot PR reviewer cannot add labels itself: it only posts
            // reviews. This job reads its Copilot reviews and applies the label.
            const copilotLogins = new Set([
              'copilot-pull-request-reviewer',
              'copilot-swe-agent',
            ]);

            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner,
              repo,
              pull_number: prNumber,
              per_page: 100,
            });

            const copilotReviews = reviews.filter(
              (r) => r.author && copilotLogins.has(r.author.login)
            );
            if (copilotReviews.length === 0) {
              core.info(`No Copilot review found on PR #${prNumber}; not labeling.`);
              return;
            }

            // Explicit verdict line ("QA required: yes|no") takes precedence.
            // Fallback: any non-negated mention of the QA label (legacy
            // reviews used the historical "QA_required" spelling).
            const isRecommended = (body) => {
              const verdict = body.match(/\bQA[ _]required\b`?\s*[:\u2013-]\s*`?(yes|no)\b/i);
              if (verdict) {
                return verdict[1].toLowerCase() === 'yes';
              }
              return /\bQA[ _]required\b/i.test(body) &&
                !/\b(?:no|not|isn't|is not|without)\b[^.\n]{0,30}\bQA[ _]required\b[^.\n]{0,60}\b(?:needed|necessary|required|recommended)\b/i.test(body) &&
                !/\bQA[ _]required\b[^.\n]{0,40}\b(?:is|are)\s+not\b[^.\n]{0,40}\b(?:needed|necessary|required|recommended)\b/i.test(body);
            };

            // Incremental Copilot reviews may omit the QA section, so any
            // non-dismissed Copilot review recommending the label is enough.
            // The label is sticky: it is added, never removed, by this job.
            const recommended = copilotReviews.some(
              (r) => r.state !== 'DISMISSED' && isRecommended(r.body || '')
            );
            if (!recommended) {
              core.info('No Copilot review recommends QA required; not labeling.');
              return;
            }

            const existing = await github.rest.issues.listLabelsOnIssue({
              owner,
              repo,
              issue_number: prNumber,
              per_page: 100,
            });
            if (existing.data.some((l) => l.name === 'QA required')) {
              core.info('QA required label already applied.');
              return;
            }

            try {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: prNumber,
                labels: ['QA required'],
              });
              core.info('Added "QA required" label.');
            } catch (e) {
              if (!/label does not exist/i.test(e.message || '')) {
                core.warning(`Failed to add label: ${e.message}`);
                return;
              }
              // Label missing from the repository: create it, then retry once.
              try {
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name: 'QA required',
                  color: '486B9C',
                  description: 'Regression or bug risk requiring specific QA testing',
                });
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: prNumber,
                  labels: ['QA required'],
                });
                core.info('Created "QA required" label and applied it.');
              } catch (e2) {
                core.warning(`Failed to create or add label: ${e2.message}`);
              }
            }
