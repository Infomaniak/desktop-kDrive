name: macOS Redesigned GUI

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode-Latest.app/Contents/Developer

defaults:
  run:
    working-directory: src/gui4/macOS

jobs:
  run-tests:
    name: Run tests
    runs-on: [ self-hosted, iOS ]

    # We disable code signing to avoid issues with missing certificates/provisioning profiles on the CI runner
    # More info here: https://github.com/orgs/community/discussions/175498
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
      - name: Build
        # A cancelled run can leave the shared DerivedData inconsistent: the
        # build database then reports object files as up to date although
        # they are missing, and the next run fails at link time with
        # "file cannot be open()ed". Retry once from a clean DerivedData
        # before giving up, so a poisoned runner state does not fail CI.
        run: |
          build_for_testing() {
            xcodebuild \
              -scheme kDrive \
              -destination "platform=macOS,arch=arm64" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              PROVISIONING_PROFILE_SPECIFIER="" \
              DEVELOPMENT_TEAM="" \
              ENABLE_HARDENED_RUNTIME=NO \
              build-for-testing
          }
          if ! build_for_testing; then
            echo "::warning::Build failed, retrying once with a clean DerivedData"
            rm -rf "$HOME/Library/Developer/Xcode/DerivedData/"kDrive-*
            build_for_testing
          fi
      - name: Run tests
        run: |
          xcodebuild \
            -scheme kDrive \
            -destination "platform=macOS,arch=arm64" \
            test-without-building

  swiftlint:
    name: SwiftLint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
      - name: Setup Mise
        # jdx/mise-action@v3.6.1
        uses: jdx/mise-action@6d1e696aa24c1aa1bcc1adea0212707c71ab78a8
        with:
          working_directory: src/gui4/macOS
      - name: SwiftLint
        run: swiftlint --config .swiftlint.yml --config .swiftlint-ci.yml --reporter github-actions-logging --reporter json .

  swiftformat:
    name: SwiftFormat
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
      - name: Setup Mise
        # jdx/mise-action@v3.6.1
        uses: jdx/mise-action@6d1e696aa24c1aa1bcc1adea0212707c71ab78a8
        with:
          working_directory: src/gui4/macOS
      - name: SwiftFormat
        run: swiftformat --lint . --reporter github-actions-log --reporter json

