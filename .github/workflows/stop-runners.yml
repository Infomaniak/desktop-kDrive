name: Tear down Windows CI runners

on:
  workflow_dispatch:
    inputs:
      wait_timeout_minutes:
        description: "Max minutes to wait for busy runners to finish"
        required: false
        default: "60"

  schedule:
    - cron: "30 19 * * *"
      timezone: "Europe/Zurich"

permissions:
  contents: read

env:
  OS_CLOUD: infomaniak
  REPO: ${{ github.repository }}

jobs:
  stop-instances:
    runs-on: ubuntu-latest
    steps:
      - name: Install OpenStack CLI
        run: pip install python-openstackclient==10.5.0 openstacksdk==4.25.0 --quiet

      - name: Write clouds.yaml
        run: |
          mkdir -p ~/.config/openstack
          cat > ~/.config/openstack/clouds.yaml <<EOF
          clouds:
            infomaniak:
              auth:
                auth_url: ${{ secrets.PUBLIC_CLOUD_OS_AUTH_URL }}
                username: ${{ secrets.PUBLIC_CLOUD_OS_USERNAME }}
                password: ${{ secrets.PUBLIC_CLOUD_OS_PASSWORD }}
                project_id: ${{ secrets.PUBLIC_CLOUD_OS_PROJECT_ID }}
                user_domain_name: ${{ secrets.PUBLIC_CLOUD_OS_USER_DOMAIN_NAME }}
              region_name: ${{ secrets.PUBLIC_CLOUD_OS_REGION_NAME }}
              interface: public
              identity_api_version: 3
          EOF

      - name: Wait for all runners to be idle
        env:
          GH_TOKEN: ${{ secrets.RUNNER_ADMIN_PAT }}
        run: |
          TIMEOUT_MIN="${{ github.event.inputs.wait_timeout_minutes || '60' }}"
          DEADLINE=$(( $(date +%s) + TIMEOUT_MIN * 60 ))

          while true; do
            # Count self-hosted runners that are currently running a job.
            # `--slurp` cannot be combined with `--jq`, so we emit one line per
            # busy ci-runner and count the lines instead.
            # Fetch first so that an API failure is retried instead of being read as "0 busy runners".
            if ! BUSY_IDS=$(gh api --paginate "/repos/${REPO}/actions/runners?per_page=100" \
               --jq '.runners[] | select(.busy == true and (.name | startswith("ci-runner-"))) | .id'); then
              BUSY_IDS="unknown"
              echo "::warning::Could not list runners, retrying."
            fi
            BUSY=$(grep -c . <<< "$BUSY_IDS" || true)

            if [ "$BUSY" -eq 0 ]; then
              echo "All runners are idle."
              break
            fi

            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "::warning::Timeout reached with $BUSY busy runner(s). Forcing teardown."
              break
            fi

            echo "$BUSY runner(s) still busy. Waiting 30s ..."
            sleep 30
          done

      - name: Remove runners from GitHub
        if: always()
        env:
          GH_TOKEN: ${{ secrets.RUNNER_ADMIN_PAT }}
        run: |
          # Delete every ci-runner-* self-hosted runner registered on the repo
          IDS=$(gh api --paginate "/repos/${REPO}/actions/runners" \
            --jq '.runners[] | select(.name | startswith("ci-runner-")) | .id')

          if [ -z "$IDS" ]; then
            echo "No matching runners registered."
          else
            rc=0
            for ID in $IDS; do
              echo "Deleting runner id=$ID ..."
              # A runner still busy after the timeout cannot be deleted: keep going with the others.
              if ! gh api -X DELETE "/repos/${REPO}/actions/runners/${ID}"; then
                echo "::warning::Could not delete runner id=$ID"
                rc=1
              fi
            done
            exit "$rc"
          fi

      - name: Delete public cloud instances
        if: always() # Always delete instances, even if previous steps failed, instances are billed by the hour
        run: |
          # Find every ci-runner instance. `openstack server list` does not
          # support filtering by --property, so we match on the instance name
          # regex instead (instances are named "ci-runner-win-<run_id>-<i>").
          SERVERS=$(openstack server list \
            --os-cloud "$OS_CLOUD" \
            --name '^ci-runner-' \
            -f value -c ID)

          if [ -z "$SERVERS" ]; then
            echo "No ci-runner instances found."
          else
            # Delete them all in one call so that one failure does not keep the others running (and billed).
            echo "Deleting instances: $(tr '\n' ' ' <<< "$SERVERS")"
            openstack server delete --os-cloud "$OS_CLOUD" --wait $SERVERS
          fi