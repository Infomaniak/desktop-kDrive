disabled_rules:
 - line_length
 - identifier_name
 - type_body_length
 - function_body_length
 - file_length
 - type_name
 - force_cast
 - cyclomatic_complexity
 - inclusive_language
 - for_where
 - optional_data_string_conversion
opt_in_rules:
 - closure_end_indentation
 - closure_spacing
 - collection_alignment
 - contains_over_filter_count
 - contains_over_first_not_nil
 - contains_over_range_nil_comparison
 - empty_collection_literal
 - empty_count
 - empty_string
 - first_where
 - identical_operands
 - last_where
 - operator_usage_whitespace
 - overridden_super_call
 - prefer_zero_over_explicit_init
 - prohibited_super_call
 - redundant_type_annotation
 - toggle_bool
 - trailing_closure
 - unneeded_parentheses_in_closure_argument
analyzer_rules:
 - unused_import
custom_rules:
  programmatic_view_controller_inheritance:
    name: "Programmatic View Controller Inheritance"
    regex: '\bclass\s+\w+(?:\s*<[^{}]*>)?\s*:\s*(?:(?:AppKit|Cocoa)\s*\.\s*)?NSViewController\b'
    match_kinds:
      - keyword
      - identifier
      - typeidentifier
    excluded: '(^|/)kDriveCoreUI/UI/AppKit/Controllers/BaseViewController\.swift$'
    message: "Use BaseViewController for nibless controllers to prevent macOS 12/13 nib-loading crashes."
    severity: error
  bare_nsviewcontroller_init:
    name: "Bare NSViewController Initialization"
    regex: '\bNSViewController\s*(?:\.\s*init\s*)?\('
    match_kinds:
      - identifier
      - typeidentifier
    message: "Use BaseViewController() to create a nibless controller safely on macOS 12/13."
    severity: error
  bare_nstoolbar_init:
    name: "Bare NSToolbar Initialization"
    regex: '\bNSToolbar\s*(?:\.\s*init\s*)?\(\s*\)'
    match_kinds:
      - identifier
      - typeidentifier
    message: "Use NSToolbar(identifier:) to prevent toolbar initialization crashes on macOS 12."
    severity: error
included:
 - kDrive
 - kDriveCoreUI
 - kDriveCore
excluded:
 - kDrive/Resources/Generated
